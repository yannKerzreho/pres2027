name: Daily update
on:
  schedule:
    - cron: "0 7 * * *" 
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Ingestion + parsing PDF
        run: python -m pipeline.build_live_dataset --since 2025
      - name: Modèle live + export JSON
        run: python -m model.simulate
      - name: Figure
        run: python -m model.plot_results
      # (optionnel) versionner l'historique des prévisions dans git
      - name: Commit résultats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/resultats_2027.json notebooks/figures/forecast_2027.png
          git commit -m "chore: maj quotidienne du modèle" || echo "rien à committer"
          git push
      # déploiement Pages (voir §3)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4