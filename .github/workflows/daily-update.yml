name: Daily update
on:
  schedule:
    # Pas à l'heure pile : GitHub met en file les crons `0 * * * *` aux heures
    # de pointe. Avec `0 7 * * *`, le run était CRÉÉ entre 11h et 17h UTC
    # (sept.-nov. 2026, dérive croissante). Une minute décalée et un horaire
    # matinal ne garantissent rien (le planificateur GitHub est « best
    # effort ») mais évitent le créneau le plus chargé.
    - cron: "37 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write

# Deux exécutions simultanées (cron + lancement manuel) se marcheraient dessus :
# elles écrivent le même snapshot du jour et poussent sur la même branche.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # runs mesurés de 9 à 20 min (nov. 2026)
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt

      # --min-sondages : la source est une page wiki éditable par n'importe qui.
      # En dessous de ce seuil, on considère que le parsing s'est dégradé, on
      # n'écrase PAS le CSV et le job échoue bruyamment plutôt que de publier un
      # snapshot calculé sur presque rien.
      #
      # --snapshots : l'incident du 2026-10-04 était une perte PARTIELLE (8
      # sondages), invisible à --min-sondages. On compare aux sondages que les
      # derniers snapshots publiés déclarent : au-delà de 20 % disparus, même
      # abandon ; en dessous, annotation ::warning:: sur le run.
      - name: Ingestion sondages (Wikipedia)
        run: python -m sondages.wiki --min-sondages 15 --snapshots docs/data

      # Rejoue aussi les dates PASSÉES dont le jeu de sondages a changé (défaut
      # quand `--as-of` est absent, cf. docstring de `model/run.py`) : un sondage
      # saisi sur Wikipedia plusieurs jours après son terrain doit déplacer la
      # courbe à sa date de TERRAIN, pas à sa date d'arrivée. Seuls les modèles
      # bon marché rejouent (`ForecastModel.rejeu_historique`) : `gp-pooling` est
      # en forme close, 86 ms par date ; `spatial-pooling` (NUTS, ~180 s par date
      # sur ce runner) est exclu, rien ne relit ses snapshots datés. Le job reste
      # donc borné quel que soit l'arriéré : l'étape modèles dure ~9 à 16 min
      # (nov. 2026), presque tout en NUTS de `spatial-pooling` pour la seule
      # date du jour.
      #
      # Tout modèle rattaché à une rubrique du site (cf. `ForecastModel.surface`)
      # — donc le suivi des intentions ET les scénarios, qui ont chacun besoin
      # d'une version fraîche chaque jour. Les variantes de diagnostic
      # (`surface=None`) sont des runs NUTS complets dont le site n'affiche
      # rien : `--all` seulement, jamais ici.
      - name: Modèles du site -> docs/data/
        run: python -m model.run

      # `!cancelled()` et pas le succès implicite : `model.run` échoue APRÈS
      # avoir laissé les autres modèles écrire (cf. `run` dans model/run.py).
      # Le job reste rouge, mais le snapshot des modèles sains est publié.
      - name: Commit résultats
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "rien à committer" && exit 0
          git commit -m "chore: maj quotidienne du modèle"
          # Rebase avant push : un commit humain arrivé entre le checkout et
          # ici ferait échouer un push direct, et on perdrait le snapshot du
          # jour pour une raison sans rapport avec le modèle.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with: { path: docs }
      - uses: actions/deploy-pages@v4
        if: ${{ !cancelled() }}
