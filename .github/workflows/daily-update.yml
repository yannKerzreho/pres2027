name: Daily update
on:
  schedule:
    # Pas à l'heure pile : GitHub met en file les crons `0 * * * *` aux heures
    # de pointe. Avec `0 7 * * *`, le run était CRÉÉ entre 11h et 17h UTC
    # (sept.-nov. 2026, dérive croissante). Une minute décalée et un horaire
    # matinal ne garantissent rien (le planificateur GitHub est « best
    # effort ») mais évitent le créneau le plus chargé.
    - cron: "37 4 * * *"
    # Filet : second créneau, ~9 h 30 plus tard. Retard mesuré du planificateur
    # sur 93 runs (sept.-nov. 2026) : 0,5 à 12 h, médiane 5,6 h ; et le run du
    # 2026-11-14 n'a jamais été créé (schedule modifié sur main avant que le
    # créneau du jour ne parte). Si le premier passage a déjà tout produit et
    # qu'aucun sondage n'a bougé, le second s'arrête après l'ingestion
    # (étape « Déjà à jour ? ») : ~1 min, pas de NUTS.
    - cron: "11 14 * * *"
  workflow_dispatch:
# Publication : Pages est en mode « deploy from branch » (main:/docs). Le push
# de l'étape « Commit résultats » déclenche à lui seul `pages-build-deployment`
# (vérifié : un build par commit du bot). Ce job ne déploie donc PAS lui-même :
# jusqu'au 2026-11-14 il appelait aussi `deploy-pages`, et les deux
# déploiements concurrents faisaient échouer l'un ou l'autre (« in progress
# deployment ») environ un jour sur trois. Ne pas réintroduire l'un sans
# basculer la source Pages sur « GitHub Actions » — et alors prévoir un
# déploiement sur push, sinon un commit humain sur docs/ attend le cron.
permissions:
  contents: write

# Deux exécutions simultanées (cron + lancement manuel) se marcheraient dessus :
# elles écrivent le même snapshot du jour et poussent sur la même branche.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # runs mesurés de 9 à 20 min (nov. 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt

      # --min-sondages : la source est une page wiki éditable par n'importe qui.
      # En dessous de ce seuil, on considère que le parsing s'est dégradé, on
      # n'écrase PAS le CSV et le job échoue bruyamment plutôt que de publier un
      # snapshot calculé sur presque rien.
      #
      # --snapshots : l'incident du 2026-10-04 était une perte PARTIELLE (8
      # sondages), invisible à --min-sondages. On compare aux sondages que les
      # derniers snapshots publiés déclarent : au-delà de 20 % disparus, même
      # abandon ; en dessous, annotation ::warning:: sur le run.
      - name: Ingestion sondages (Wikipedia)
        id: ingestion
        run: python -m sondages.wiki --min-sondages 15 --snapshots docs/data

      # Rejoue aussi les dates PASSÉES dont le jeu de sondages a changé (défaut
      # quand `--as-of` est absent, cf. docstring de `model/run.py`) : un sondage
      # saisi sur Wikipedia plusieurs jours après son terrain doit déplacer la
      # courbe à sa date de TERRAIN, pas à sa date d'arrivée. Seuls les modèles
      # bon marché rejouent (`ForecastModel.rejeu_historique`) : `gp-pooling` est
      # en forme close, 86 ms par date ; `spatial-pooling` (NUTS, ~180 s par date
      # sur ce runner) est exclu, rien ne relit ses snapshots datés. Le job reste
      # donc borné quel que soit l'arriéré : l'étape modèles dure ~9 à 16 min
      # (nov. 2026), presque tout en NUTS de `spatial-pooling` pour la seule
      # date du jour.
      #
      # Tout modèle rattaché à une rubrique du site (cf. `ForecastModel.surface`)
      # — donc le suivi des intentions ET les scénarios, qui ont chacun besoin
      # d'une version fraîche chaque jour. Les variantes de diagnostic
      # (`surface=None`) sont des runs NUTS complets dont le site n'affiche
      # rien : `--all` seulement, jamais ici.
      # Seulement sur un passage PLANIFIÉ : un lancement manuel recalcule
      # toujours. « À jour » = le CSV ingéré est identique à celui du dépôt ET
      # chaque modèle à index (docs/data/<id>/index.json) a déjà son snapshot du
      # jour. Le point quotidien n'a pas à être recalculé deux fois.
      - name: Déjà à jour ?
        id: etat
        if: ${{ github.event_name == 'schedule' }}
        run: |
          jour=$(date -u +%F)
          if git diff --quiet -- data/parsed/intentions_2027_wiki.csv; then
            for idx in docs/data/*/index.json; do
              if [ ! -f "$(dirname "$idx")/$jour.json" ]; then
                echo "manque $(dirname "$idx")/$jour.json"; exit 0
              fi
            done
            echo "sondages inchangés et snapshots du $jour présents : rien à recalculer"
            echo "a_jour=true" >> "$GITHUB_OUTPUT"
          else
            echo "sondages modifiés depuis le dernier commit : recalcul"
          fi

      - name: Modèles du site -> docs/data/
        if: ${{ steps.etat.outputs.a_jour != 'true' }}
        run: python -m model.run

      # `!cancelled()` et pas le succès implicite : `model.run` échoue APRÈS
      # avoir laissé les autres modèles écrire (cf. `run` dans model/run.py).
      # Le job reste rouge, mais le snapshot des modèles sains est publié (le push
      # déclenche la publication Pages, cf. en-tête).
      - name: Commit résultats
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # Le CSV 2027 est versionné (cf. .gitignore) mais n'est committé que si
          # l'ingestion a RÉUSSI, donc passé --min-sondages et --snapshots : une
          # extraction cassée n'écrase jamais la version du dépôt. (`sondages.wiki`
          # n'écrit déjà rien quand un garde-fou mord ; ce test couvre en plus un
          # échec APRÈS l'écriture.) Inchangé -> `git add` n'ajoute rien.
          if [ "${{ steps.ingestion.outcome }}" = "success" ]; then
            git add data/parsed/intentions_2027_wiki.csv
          else
            git checkout -- data/parsed/intentions_2027_wiki.csv 2>/dev/null || true
          fi
          git diff --cached --quiet && echo "rien à committer" && exit 0
          git commit -m "chore: maj quotidienne du modèle et des sondages"
          # Rebase avant push : un commit humain arrivé entre le checkout et
          # ici ferait échouer un push direct, et on perdrait le snapshot du
          # jour pour une raison sans rapport avec le modèle.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
